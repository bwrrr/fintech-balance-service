<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fintech Balance Service</title>
</head>
<body>
    <h2>Money Transfer</h2>

    <p>Idempotency Key: <input type="text" id="idempKey"></p>
    <p>Sender User ID: <input type="number" id="fromUser" value="1"></p>
    <p>Receiver User ID: <input type="number" id="toUser" value="2"></p>
    <p>Amount: <input type="number" id="amount" value="500"></p>

    <button onclick="send()">Submit Transfer</button>

    <h3>Result:</h3>
    <pre id="result">Ready for submission</pre>

    <script>
        document.getElementById('idempKey').value = 'key-' + Math.random().toString(36).substring(2, 7);

        function send() {
            var data = {
                idempotency_key: document.getElementById('idempKey').value,
                from_user_id: Number(document.getElementById('fromUser').value),
                to_user_id: Number(document.getElementById('toUser').value),
                amount: Number(document.getElementById('amount').value)
            };

            fetch('/api/transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.text())
            .then(text => {
                document.getElementById('result').innerText = text;
            })
            .catch(err => {
                document.getElementById('result').innerText = 'Error: ' + err;
            });
        }
    </script>
</body>
</html>
